# The presets in this package configure a toolchain that does not read npm,
# so the only real validation is the toolchain itself.
name: Native Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: Toolchain accepts the presets
    uses: sebastienrousseau/config/.github/workflows/reusable-native-validate.yml@097fb1a947e0821d19cfe2124c634a6ee3106f0a # main
    with:
      language: python
